# Oops, Ninja config doesn't work with this one.
set_build_tool ("rocprofiler", "Unix Makefiles")

set_configure_key ("sollve_vv", "rocm_opts", :| --system |)

add_testsuites llvm llvm clang flang lld compiler_rt libcxx libcxxabi \
                    libunwind

add_testsuites misc ovo

proc add_optional_module (Mod) {
  case (Mod) {
    rocgdb {
      add_components rocgdb
    }

    rocprofiler {
      add_components rocprofiler
    }

    composable_kernel {
      add_components composable_kernel
    }

    * {
      error "Unknown optional module: $Mod"
    }
  }
}

proc remove_optional_feature (Feat) {
  case (Feat) {
    flang_new {
      var Projects = ConfigureOpts.llvm.projects
      set_configure_key ("llvm", "projects", list_remove(Projects, 'flang'))
    }

    * {
      error "Unknown optional feature: $Feat"
    }
  }
}

add_config_adjustment {
  var HipSrc = get_srcdir("hip")
  var HipCCBuild = get_objdir("hipcc")
  var LLVM_Inst = get_installdir('llvm')
  set_configure_opts ('hipamd', :| -DHIP_COMMON_DIR=$HipSrc
                                   -DHIP_PLATFORM=amd
                                   -DHIP_COMPILER=clang
                                   -DCMAKE_HIP_ARCHITECTURES=OFF
                                   -DHIP_ENABLE_ROCPROFILER_REGISTER=ON
                                   -DROCM_PATH=$INSTALLDIR
                                   -DHIP_LLVM_ROOT=$LLVM_Inst
                                   -DCLR_BUILD_HIP=ON
                                   -DCLR_BUILD_OCL=ON
                                   -DHIPCC_BIN_DIR=$HipCCBuild |)
}
