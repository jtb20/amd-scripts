# This has to be defined *before* we add the hipamd component, else the conditional
# dep won't work for amd-checkout.
func hipamd_conditional_deps() {
  return (:| rocprofiler_register opencl_icd_loader |)
}

func llvm_conditional_deps() {
  return (:| hwloc |)
}

add_components llvm comgr device_libs hipamd hip hipcc ovo
add_components rocminfo

set_configure_key ("llvm", "projects", :| clang flang lld clang-tools-extra |)

set_configure_key ("llvm", "targets", :| X86 AMDGPU |)

set_configure_key ("llvm", "runtimes", :| compiler-rt libcxx libcxxabi
                                          libunwind |)

# These need updating.
set_configure_key ("llvm", "gfxlist", :| gfx700 gfx701 gfx801 gfx803 gfx900
                                         gfx902 gfx906 gfx908 gfx90a gfx90c
                                         gfx942 gfx1030 gfx1031
                                         gfx1035 gfx1036 gfx1100 gfx1101
                                         gfx1102 gfx1103 gfx1200 gfx1201 |)

set_configure_key ("llvm", "spirv_translator", false)

set_configure_key ("llvm", "append_install_dir", "lib/llvm")

# So do these.
set_configure_key ("rocprofiler", "gfxlist", :| gfx700 gfx701 gfx801 gfx803
