var FlangAdjective = 'classic'

source $CONFIGDIR/llvm/mainline+amd-staging.inc
source $CONFIGDIR/rocm/6.3/rocm-6.3.inc
source $CONFIGDIR/aomp/20/aomp-tests-20.0.inc
source $CONFIGDIR/aomp/20/aomp.inc
source $CONFIGDIR/rocm/6.3/rocm-supp-6.3.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/llvm/spirv-translator-amd-staging.inc

# We need this for patching sources for some components, e.g. rocr_runtime.
set_configure_key ("aomp", "patch_control", "patch-control-file_20.0.txt")

# Hm, this is a dependency now even if we build with the feature removed.
# That's not perfect but it should be OK.
var llvm_more_conditional_deps = :| spirv_llvm_translator |

func hipamd_conditional_deps() {
  return (:| rocprofiler_register opencl_icd_loader |)
}

source $CONFIGDIR/aomp/aomp-common.inc
source $CONFIGDIR/aomp/aomp-config-19-plus.inc

set_configure_key ("rocr_runtime", "aomp_patch", false)

# We need this fake module for the bits in the amd/ subdirectory.
add_components llvm_amd_staging

add_config_adjustment {
  set_configure_key ("sollve_vv", "flags",
    :| -Wl,-rpath,$[get_installdir('llvm')]/lib:$[get_installdir('llvm')]/lib/x86_64-unknown-linux-gnu
       --rocm-path=$INSTALLDIR
       -O2
       -fopenmp |)
}

var AOMP_MAJOR_VERSION=20
