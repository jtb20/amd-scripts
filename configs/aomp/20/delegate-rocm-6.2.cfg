source $CONFIGDIR/llvm/amd-staging.inc
source $CONFIGDIR/rocm/6.2/rocm-6.2.inc
source $CONFIGDIR/aomp/20/aomp-tests-20.0.inc
source $CONFIGDIR/aomp/20/aomp.inc
source $CONFIGDIR/rocm/6.2/rocm-supp-6.2.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

mkdir -p $OBJDIR/aomp-home

setglobal BwrapExtraOpts = :| --tmpfs /home
                              --bind $HOME $HOME
                              --bind $OBJDIR/aomp-home /home/aomp
                              --setenv HOME /home/aomp |
setglobal BwrapUnshareNet = false

add_components x_symlinks

set_configure_key ('aomp_delegate', 'aomp_version', '20.0')
set_configure_key ('aomp_delegate', 'aomp_repos', '/home/aomp/git/aomp20.0')

if (ScriptName === 'amd-checkout') {
  write """
  Please check out aomp/20/amd-staging-rocm-6.2.cfg instead for this config.
  amd-build can then be used to do a delegated build with the AOMP scripts using this config.
  """
  exit 1
}

proc get_aomp_component_list() {
  var AOMPSrc = get_srcdir('aomp')
  try 2> /dev/null {
    $AOMPSrc/bin/build_aomp.sh select __dummy__
  }
}

proc probe_aomp_components() {
  var Components = $(get_aomp_component_list | grep "^COMPONENTS:")
  setvar Components = Components=>trimStart("COMPONENTS:")=>shSplit()
  for Comp in (Components) {
    var CompName = Comp=>replace('-','_')
    add_components "x_$CompName"
  }
}

if (ScriptName === 'amd-build' and NoBWrap) {
  probe_aomp_components
}
