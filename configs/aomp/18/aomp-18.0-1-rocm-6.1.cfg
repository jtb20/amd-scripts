# AOMP 18.0-1 with the ROCm 6.1 components it was released against (see
# manifests/aomp_18.0-1.xml in the AOMP repository).
#
# AOMP 18.0-1 shipped against ROCm 6.0 (aomp-18.0-1-rocm-6.0.cfg); this
# pairs it with the next ROCm release instead.
#
# Like the newer configs this builds standalone: the compiler, device
# libraries, runtimes and HIP all come from this work directory, never from a
# system ROCm installation.

var AOMP_MAJOR_VERSION = 18

source $CONFIGDIR/llvm/aomp-18.0-1.inc
source $CONFIGDIR/rocm/6.1/rocm-6.1.inc
source $CONFIGDIR/aomp/18/aomp-tests-18.0.inc
source $CONFIGDIR/aomp/18/aomp.inc
source $CONFIGDIR/rocm/6.1/rocm-supp-6.1.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

# The shared ROCm 6.1 sources leave the HIP runtime options to the config.
source $CONFIGDIR/rocm/hipamd-clr.inc

# Patches for rocr_runtime come from this release's own bin/patches.
set_configure_key ("aomp", "patch_control", "patch-control-file_18.0.txt")

source $CONFIGDIR/aomp/aomp-config-15-18.inc
