source $CONFIGDIR/llvm/amd-staging.inc
source $CONFIGDIR/rocm/6.1/rocm-6.1.inc
source $CONFIGDIR/aomp/19/aomp-tests-19.0.inc
source $CONFIGDIR/aomp/19/aomp.inc
source $CONFIGDIR/rocm/6.1/rocm-supp-6.1.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

# We need this for patching sources for some components, e.g. rocr_runtime.
set_configure_key ("aomp", "patch_control", "patch-control-file_19.0.txt")

# Define conditional deps before adding their associated component.
var llvm_more_conditional_deps = :| roct_thunk_interface rocr_runtime_patch
                                    roct_thunk_add_symlink |

func rocr_runtime_conditional_deps() {
  # Make sure we don't have the patch applied for the LLVM (runtimes) build
  # before we build rocr_runtime separately.
  return (:| rocr_runtime_unpatch |)
}

source $CONFIGDIR/aomp/aomp-common.inc

add_components roct_thunk_remove_symlink rocr_runtime_unpatch

set_configure_key ("rocr_runtime", "aomp_patch", true)

var AOMP_MAJOR_VERSION=19
