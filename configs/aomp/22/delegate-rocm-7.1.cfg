var FlangAdjective = 'classic'

if (FlangAdjectiveOverride) {
  setglobal FlangAdjective = FlangAdjectiveOverride
}

source $CONFIGDIR/llvm/amd-staging.inc
source $CONFIGDIR/llvm/spirv-translator-amd-staging.inc
source $CONFIGDIR/rocm/7.1/rocm-7.1.inc
source $CONFIGDIR/aomp/22/aomp-tests-22.0.inc
source $CONFIGDIR/aomp/22/aomp.inc
source $CONFIGDIR/rocm/7.1/rocm-supp-7.1.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc

if (ScriptName === 'amd-checkout') {
  write """
  Please check out aomp/22/amd-staging-rocm-7.1.cfg instead for this config.

  \$ amd-checkout --add flang_legacy,rocgdb aomp/22/amd-staging-rocm-7.1.cfg

  amd-build can then be used to do a delegated build with the AOMP scripts
  using this config, e.g.:

  \$ amd-build -C aomp/22/delegate-rocm-7.1.cfg
  """
  exit 1
}

set_configure_key ('aomp_delegate', 'aomp_version', '22.0')
set_configure_key ('aomp_delegate', 'aomp_repos', '/home/aomp/git/aomp22.0')

set_configure_key ("llvm", "append_install_dir", "lib/llvm")

# Oops, Ninja config doesn't work with this one.
set_build_tool ("rocprofiler", "Unix Makefiles")

func ao_project_conditional_deps() {
  return (:| spirv_llvm_translator |)
}

source $CONFIGDIR/aomp/delegated-aomp-build.inc

# This isn't turned on by default any more.
set_configure_key ('aomp_delegate', 'flang_classic', false)
