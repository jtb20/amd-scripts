# AOMP 17.0-3 with the ROCm 5.6 components it was released against (see
# manifests/aomp_17.0-3.xml in the AOMP repository).
#
# Note that this clang emits code object v5 by default, which the ROCm 5.6
# HIP runtime can't load (HIP programs crash in hipLaunchKernel).  Compile
# HIP code with -mcode-object-version=4.  OpenMP offloading is unaffected:
# AOMP 17's own offload runtime handles v5.
#
# Like the newer configs this builds standalone: the compiler, device
# libraries, runtimes and HIP all come from this work directory, never from a
# system ROCm installation.

var AOMP_MAJOR_VERSION = 17

source $CONFIGDIR/llvm/aomp-17.0.inc
source $CONFIGDIR/rocm/5.6/rocm-5.6.inc
source $CONFIGDIR/aomp/17/aomp-tests-17.0.inc
source $CONFIGDIR/aomp/17/aomp.inc
source $CONFIGDIR/rocm/5.6/rocm-supp-5.6.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

# Patches for rocr_runtime come from this release's own bin/patches.
set_configure_key ("aomp", "patch_control", "patch-control-file_17.0.txt")

source $CONFIGDIR/aomp/aomp-config-15-18.inc
