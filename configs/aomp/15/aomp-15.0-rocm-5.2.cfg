source $CONFIGDIR/llvm/aomp-15.0.inc
source $CONFIGDIR/rocm/5.2/rocm-5.2.inc
source $CONFIGDIR/aomp/15/aomp-tests-15.0.inc
source $CONFIGDIR/aomp/15/aomp.inc
source $CONFIGDIR/rocm/5.2/rocm-supp-5.2.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

# We need this for patching sources for some components, e.g. rocr_runtime.
set_configure_key ("aomp", "patch_control", "patch-control-file_15.0.txt")

# We don't have 'hipcc' for this config.  Override deps for rocgdb, because
# that lists hipcc by default.

setglobal Sources.rocgdb.deps = :| rocm_dbgapi gmp mpfr llvm |
setglobal Sources.rocm_dbgapi.deps = :| hipamd llvm |

# Define conditional deps before adding their associated component.
var llvm_more_conditional_deps = :| roct_thunk_interface rocr_runtime_patch
                                    roct_thunk_add_symlink |

func rocr_runtime_conditional_deps() {
  # Make sure we don't have the patch applied for the LLVM (runtimes) build
  # before we build rocr_runtime separately.
  return (:| rocr_runtime_unpatch |)
}

add_components openmp

source $CONFIGDIR/aomp/aomp-common.inc

set_configure_key ("llvm", "gfxlist", :| gfx700 gfx701 gfx801 gfx803 gfx900
                                         gfx902 gfx906 gfx908 gfx90a gfx90c
                                         gfx940 gfx1030 gfx1031 gfx1035
                                         gfx1036 |)

set_configure_key ("llvm", "projects", :| clang lld compiler-rt |)

add_config_adjustment {
  append_configure_opts ("llvm", :| -DLLVM_BUILD_LLVM_DYLIB=OFF
                                    -DLLVM_LINK_LLVM_DYLIB=OFF
                                    -DCLANG_LINK_CLANG_DYLIB=OFF
                                    -DLLVM_ENABLE_ASSERTIONS=ON
                                    -DLLVM_ENABLE_BINDINGS=OFF
                                    -DLLVM_INCLUDE_BENCHMARKS=OFF
                                    -DCLANG_DEFAULT_LINKER=lld
                                    -DLLVM_VERSION_SUFFIX=_AOMP_STANDALONE |)
}

add_config_adjustment {
  var HipSrc = get_srcdir("hip")
  var LLVM_Inst = get_installdir('llvm')
  set_configure_opts ('hipamd', :| -DAMD_OPENCL_PATH=$[get_srcdir ('opencl_runtime')]
                                   -DCMAKE_CXX_FLAGS='-I$INSTALLDIR/include/amd_comgr'
                                   -DHIP_COMMON_DIR=$HipSrc
                                   -DROCCLR_PATH=$[get_srcdir ('rocclr')]
                                   -DROCM_PATH=$INSTALLDIR |)
}

set_configure_key ("llvm", "runtimes", [])

# Legacy LLVM install dir layout.
set_configure_key ("llvm", "append_install_dir", null)

# No SPIRV translator
set_configure_key ("llvm", "spirv_translator", false)

set_configure_opts ("openmp", :| -DOPENMP_ENABLE_LIBOMPTARGET_HSA=1 |)

#set_configure_opts ("hipamd",
#                    :| -DAMD_OPENCL_PATH=$[get_srcdir ('opencl_runtime')]
#                       -DCMAKE_CXX_FLAGS=-I$INSTALLDIR/include/amd_comgr |)

add_components roct_thunk_remove_symlink rocr_runtime_unpatch

add_components opencl_runtime

set_configure_key ("rocr_runtime", "aomp_patch", true)

# set_build_tool ("hipamd", "Unix Makefiles")

var AOMP_MAJOR_VERSION=15
