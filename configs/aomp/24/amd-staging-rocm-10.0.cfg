# LLVM amd-staging against the released ROCm 10.0 stack.  This is the same
# component set as mainline+amd-staging-rocm-10.0.cfg, but LLVM comes from
# amd-staging directly rather than from upstream main with an amd-staging
# worktree alongside, so there is no llvm_amd_staging component here and the
# amd/ subdirectories come straight out of the LLVM checkout.

var FlangAdjective = 'classic'

if (FlangAdjectiveOverride) {
  setglobal FlangAdjective = FlangAdjectiveOverride
}

source $CONFIGDIR/llvm/amd-staging.inc
source $CONFIGDIR/rocm/10.0/rocm-10.0.inc
source $CONFIGDIR/aomp/24/aomp-tests-24.0.inc
source $CONFIGDIR/aomp/24/aomp.inc
source $CONFIGDIR/rocm/10.0/rocm-supp-10.0.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-16.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/10.0/rocm_dbgapi-10.0.inc
source $CONFIGDIR/llvm/spirv-translator-amd-staging.inc
source $CONFIGDIR/llvm/libhsastream.inc
source $CONFIGDIR/llvm/hrx-system.inc

# We need this for patching sources for some components, e.g. rocr_runtime.
# The only patch 24.0 actually names is rocr-runtime-numa.patch, which still
# applies to the ROCm 10 sources; the hipamd and clr entries are empty.
set_configure_key ("aomp", "patch_control", "patch-control-file_24.0.txt")

# The rocr_runtime sources have to be patched for the llvm build as well as for
# rocr_runtime's own, so llvm depends on the patch and the unpatch depends on
# llvm, bracketing the operation.  See modules/rocr_runtime.  spirv is in here
# because it is a dependency now even if we build with the feature removed;
# that's not perfect but it should be OK.
var llvm_more_conditional_deps = :| rocr_runtime_patch spirv_llvm_translator |

func rocr_runtime_conditional_deps() {
  # Make sure we don't have the patch applied for the LLVM (runtimes) build
  # before we build rocr_runtime separately.
  return (:| rocr_runtime_unpatch |)
}

func hipamd_conditional_deps() {
  return (:| rocprofiler_register opencl_icd_loader |)
}

func rocprofiler_sdk_conditional_deps() {
  return (:| aqlprofile |)
}

source $CONFIGDIR/aomp/aomp-common.inc
source $CONFIGDIR/aomp/aomp-config-19-plus.inc

# (After aomp-common.inc: hipify depends on llvm, and adding llvm before
# aomp-common.inc defines llvm_conditional_deps would skip llvm's conditional
# dependencies, such as the SPIR-V translator sources.)
add_components hipify

add_config_adjustment {
  var LLVMObj = get_objdir('llvm')
  append_configure_opts ('llvm', :| -DCMAKE_PREFIX_PATH=$LLVMObj/lib/cmake |)
}

set_configure_key ("rocr_runtime", "aomp_patch", true)
set_configure_opts ("rocr_runtime", :| -DBUILD_SHARED_LIBS=On |)

set_configure_key ("hipamd", "aomp_patch", true)

set_configure_key ("llvm", "gpu_runtimes", :| openmp |)
# Fortran runtime for the GPU, the current way (--remove gpu_flang_rt for the
# older LIBOMPTARGET_BUILD_DEVICE_FORTRT behaviour).
set_configure_key ("llvm", "gpu_flang_rt", true)

set_configure_opts ("rocprofiler_sdk", :| -DROCTX_API=TRUE |)

# This bit is just for applying a patch (in hipamd!)
var rocclr_src = {
  "type": "subcomponent",
  "parent": "hipamd",
  "subdir" : "."
}

add_sources ("rocclr", rocclr_src)

add_config_adjustment {
  set_configure_key ("sollve_vv", "flags",
    :| -Wl,-rpath,$[get_installdir('llvm')]/lib:$[get_installdir('llvm')]/lib/x86_64-unknown-linux-gnu
       --rocm-path=$INSTALLDIR
       -O2
       -fopenmp |)
}

# This can probably be somewhere more generic
add_config_adjustment {
  var LLVM_Inst = get_installdir('llvm')
  var OpenCLICDLoaderSrc = get_srcdir('opencl_icd_loader')
  append_configure_opts ('hipamd', :| -DCMAKE_PREFIX_PATH="$INSTALLDIR;$LLVM_Inst;$OpenCLICDLoaderSrc"
                                      -DCMAKE_INSTALL_LIBDIR=lib
                                      -DCMAKE_CXX_FLAGS="-I$INSTALLDIR/include/amd_comgr -Wno-error=deprecated-declarations"
                                      -DCMAKE_C_FLAGS="-Wno-error=deprecated-declarations"
                                      -DBUILD_SHARED_LIBS=ON |)
}

var AOMP_MAJOR_VERSION=24
