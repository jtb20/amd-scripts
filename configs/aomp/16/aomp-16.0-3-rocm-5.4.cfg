# AOMP 16.0-3 with the ROCm 5.4 components it was released against (see
# manifests/aomp_16.0-3.xml in the AOMP repository).
#
# Like the newer configs this builds standalone: the compiler, device
# libraries, runtimes and HIP all come from this work directory, never from a
# system ROCm installation.

var AOMP_MAJOR_VERSION = 16

source $CONFIGDIR/llvm/aomp-16.0.inc
source $CONFIGDIR/rocm/5.4/rocm-5.4.inc
source $CONFIGDIR/aomp/16/aomp-tests-16.0.inc
source $CONFIGDIR/aomp/16/aomp.inc
source $CONFIGDIR/rocm/5.4/rocm-supp-5.4.inc
source $CONFIGDIR/aomp/openmp-examples.inc
source $CONFIGDIR/rocm/rocgdb-14.inc
source $CONFIGDIR/gcc/gcc-infra.inc
source $CONFIGDIR/rocm/mainline/rocm_dbgapi-mainline.inc
source $CONFIGDIR/rocm/mainline/rocprofiler-mainline.inc

# Patches for rocr_runtime and hipamd come from this release's own
# bin/patches, except for rocr_runtime: the release's rocr-runtime-numa.patch
# still carries workarounds for Ubuntu 18's libelf and clang 14, which a later
# AOMP commit removed ("remove workaround for old libelf in ubuntu 18").
set_configure_key ("aomp", "patch_control", "patch-control-file_16.0.txt")
set_aomp_patch (comp='rocr_runtime', file='rocr-runtime-numa.patch',
                rev='afa0ed9b60c6a67836cf7e17d9a036b4bead1263')

source $CONFIGDIR/aomp/aomp-config-15-18.inc
