# GCC 15 for a build-toolsroot root filesystem: see toolsroot-gcc.inc.
#
# build-toolsroot's default.  GCC 15 still defaults to -std=gnu++17, which the
# old libstdc++ headers it compiles against fully support.  (GCC 16 defaults
# to gnu++20, where bullseye's GCC 10 headers are experimental.)

var gcc_src = {
  "url" : "https://gcc.gnu.org/pub/gcc/releases/gcc-15.3.0/gcc-15.3.0.tar.xz",
  "type" : "archive",
  "version" : "15.3.0",
  "version_name" : "15.3.0",
  "md5" : "82f6bba8e5b66bafe081601fe3c88fba",
  # gmp, mpfr, mpc and isl come from the system's packages.
  "deps" : [],
}

add_sources ("gcc", gcc_src)

source $CONFIGDIR/toolsroot/toolsroot-gcc.inc
