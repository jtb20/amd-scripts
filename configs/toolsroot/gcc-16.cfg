# GCC 16 for a build-toolsroot root filesystem: see toolsroot-gcc.inc.
#
# Note that GCC 16 defaults to -std=gnu++20, which the old libstdc++ headers
# it compiles against may only partly support (bullseye's GCC 10 headers do so
# experimentally).  Code that sets its own standard, like LLVM, is unaffected.

var gcc_src = {
  "url" : "https://gcc.gnu.org/pub/gcc/releases/gcc-16.2.0/gcc-16.2.0.tar.xz",
  "type" : "archive",
  "version" : "16.2.0",
  "version_name" : "16.2.0",
  "md5" : "19b777fb19ea4982731392481306f0d3",
  # gmp, mpfr, mpc and isl come from the system's packages.
  "deps" : [],
}

add_sources ("gcc", gcc_src)

source $CONFIGDIR/toolsroot/toolsroot-gcc.inc
