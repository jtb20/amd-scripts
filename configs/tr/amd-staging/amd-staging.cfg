source "$CONFIGDIR/tr/amd-staging/therock.inc"

set_configure_opts ('therock',
                    :| -DTHEROCK_VERBOSE=ON
                       -DTHEROCK_AOMP_BUILD=ON
                       -DTHEROCK_AOMP_VERSION_MOD=1
                       -DTHEROCK_DEFAULT_LLVM_TOOLSET=ON
                       -DTHEROCK_DEFAULT_CLANG_TOOLSET=ON |)

source "$CONFIGDIR/tr/common.inc"

add_checkout_adjustment {
  proc switch_branch(Component, Dir, BranchName) {
    cd $Dir {
      write "Post-checkout hook: switch $Component branch to $BranchName"
      try {
        git checkout $BranchName
      }
      if failed {
        write "Failed to switch to $BranchName branch for $Component"
      }
    }
  }
  var TheRockSrc = get_srcdir('therock')
  switch_branch LLVM $TheRockSrc/compiler/amd-llvm amd-staging
  switch_branch SPIRV-LLVM-Translator $TheRockSrc/compiler/spirv-llvm-translator amd-staging
}
