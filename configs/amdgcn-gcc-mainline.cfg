source $_this_dir/gcc-mainline.inc
source $_this_dir/llvm-18.inc

var accel_gcc_src = {
  "parent" : "gcc",
  "type" : "subcomponent",
  "subdir" : ".",
}

add_sources ("accel_gcc", accel_gcc_src)
add_sources ("accel_gcc_first", accel_gcc_src)

var newlib_src = {
  "url" : "https://sourceware.org/git/newlib-cygwin.git",
  "type" : "git",
  "version" : "master",
  "version_name" : "mainline",
  "shallow_clone" : "false"
}

add_sources ("accel_newlib", newlib_src)

var binutils_src = {
  "url" : "git://sourceware.org/git/binutils-gdb.git",
  "type" : "git",
  "version" : "master",
  "version_name" : "mainline",
  "shallow_clone" : false
}

add_sources ("binutils", binutils_src)

add_components accel_gcc_first accel_newlib accel_gcc gcc

# This default function could be called automatically from somewhere...
default_configure_opts_gcc
append_configure_opts ("gcc", :| --target=x86_64-linux-gnu
                                 --enable-offload-targets=amdgcn-amdhsa |)

#                                             --with-sysroot=$INSTALLDIR/amdgcn-amdhsa
#                                             --with-build-sysroot=$INSTALLDIR/amdgcn-amdhsa

default_configure_opts_accel_gcc_first
append_configure_opts ("accel_gcc_first", :| --target=amdgcn-amdhsa
                                             --with-newlib --without-headers
                                             --enable-languages=c
                                             --disable-nls --disable-decimal-float
                                             --disable-libssp --disable-threads
                                             --disable-libatomic --disable-libitm
                                             --disable-libsanitizer --disable-libquadmath
                                             --disable-lto --without-isl
                                             --disable-libgomp
                                             --with-as=$(which amdgcn-amdhsa-as)
                                             --with-ld=$(which amdgcn-amdhsa-ld) |)

default_configure_opts_accel_newlib
append_configure_opts ("accel_newlib", :| --target=amdgcn-amdhsa |)

default_configure_opts_accel_gcc
append_configure_opts ("accel_gcc", :| --target=amdgcn-amdhsa
                                       --enable-as-accelerator-for=x86_64-linux-gnu
                                       --disable-decimal-float
                                       --enable-languages=c,lto |)

set_configure_opts ("binutils", :| --target=x86_64-linux-gnu |)
