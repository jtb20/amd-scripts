source $_this_dir/llvm-amd-staging.inc
source $_this_dir/rocm-6.1.inc
source $_this_dir/aomp-tests-19.0.inc
source $_this_dir/aomp.inc

add_components llvm comgr device_libs
add_components rocm_cmake roct_thunk_interface rocr_runtime
add_components hipamd

# set_configure_key ("llvm", "projects", :| clang lld clang-tools-extra openmp |)
set_configure_key ("llvm", "projects", :| clang lld clang-tools-extra |)
set_configure_key ("llvm", "targets", :| X86 AMDGPU |)
set_configure_key ("llvm", "runtimes", :| compiler-rt libcxx libcxxabi libunwind |)

default_configure_opts_llvm
append_configure_opts ("llvm", :| -DLLVM_BUILD_LLVM_DYLIB=ON
                                  -DCLANG_ENABLE_AMDCLANG=ON
                                  -DOPENMP_ENABLE_LIBOMPTARGET=1
                                  -DLIBCXX_ENABLE_STATIC=ON
                                  -DLIBCXXABI_ENABLE_STATIC=ON |)

# set_build_tool ("rocm_cmake", "Unix Makefiles")
# set_build_tool ("rocr_runtime", "Unix Makefiles")

# We want this as a component just because we're fetching the aomp dev tools
# git repo.  We don't run any tasks relating to this component, but we use it
# for testing.
add_components aomp sollve_vv

add_testsuites aomp examples smoke smokefails sollve_vv hip_openmp llnl