source $CONFIGDIR/aomp/aomp.inc
source $CONFIGDIR/aomp/19/aomp-tests-19.0.inc

if (ScriptName === "amd-checkout" and
    (GithubUsername === null or GithubUsername === "")) {
  error "For this config, use the --ghuser <your GitHub username> or --ghuser llvm option"
}

var llvm_src = {
  "url" : "git@github.com:$GithubUsername/llvm-project.git",
  "type" : "git",
  "version" : "main",
  "version_name" : "main",
  "shallow_clone" : false
}

add_sources ("llvm", llvm_src)

set_configure_key ("llvm", "projects", :| clang flang lld clang-tools-extra |)
set_configure_key ("llvm", "targets", :| all |)
set_configure_key ("llvm", "runtimes", :| compiler-rt libcxx libcxxabi
                                          libunwind openmp offload |)

add_components llvm

append_configure_opts ("llvm", :| -DOPENMP_ENABLE_LIBOMPTARGET=1
                                  -DLIBCXX_ENABLE_STATIC=ON
                                  -DLIBCXXABI_ENABLE_STATIC=ON |)

add_testsuites llvm llvm clang flang lld compiler_rt libcxx libcxxabi \
                    libunwind offload openmp

proc add_optional_module (Mod) {
  case (Mod) {
    openmp_project {
      # Build OpenMP as a project instead of as a runtime.  For building
      # LLVM revisions before (sometime early 2024) the "offload" directory
      # was introduced at the top level of the LLVM repo.
      set_configure_key ("llvm", "projects", :| clang lld clang-tools-extra
                                                openmp |)
      set_configure_key ("llvm", "runtimes", :| compiler-rt libcxx libcxxabi
                                                libunwind |)
    }

    sollve_vv {
      # You need to run amd-test with the -B/--no-bwrap option here, to avoid
      # hiding the system /opt/rocm (we pick bits up from there for this
      # config).
      add_components sollve_vv
      add_testsuites misc sollve_vv
    }

    * {
      error "Unknown optional module: $Mod"
    }
  }
}
