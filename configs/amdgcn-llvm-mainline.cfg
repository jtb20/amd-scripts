if (ScriptName === "amd-checkout" and
    (GithubUsername === null or GithubUsername === "")) {
  error "For this config, use the --ghuser <your GitHub username> or --ghuser llvm option"
}

var llvm_src = {
  "url" : "git@github.com:$GithubUsername/llvm-project.git",
  "type" : "git",
  "version" : "main",
  "version_name" : "main",
  "shallow_clone" : false
}

add_sources ("llvm", llvm_src)

set_configure_key ("llvm", "projects", :| clang lld clang-tools-extra |)
set_configure_key ("llvm", "targets", :| all |)
set_configure_key ("llvm", "runtimes", :| compiler-rt libcxx libcxxabi
                                          libunwind openmp offload |)

add_components llvm

default_configure_opts_llvm
append_configure_opts ("llvm", :| -DOPENMP_ENABLE_LIBOMPTARGET=1
                                  -DLIBCXX_ENABLE_STATIC=ON
                                  -DLIBCXXABI_ENABLE_STATIC=ON |)

add_testsuites llvm llvm clang clang-tools-extra lld